<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sylvia's Daily Beauty Life</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
            background: linear-gradient(160deg, #fdf6f0 0%, #f0f4fa 30%, #faf0f5 60%, #f5f7fb 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 12px;
        }

        .app {
            width: 100%;
            max-width: 420px;
            background: linear-gradient(155deg, #fdf7f2 0%, #eef3f9 25%, #fbf1f6 55%, #f3f6fb 100%);
            border-radius: 28px;
            box-shadow: 0 8px 30px rgba(80, 90, 110, 0.15);
            padding: 22px 16px;
            position: relative;
            min-height: 95vh;
            overflow: hidden;
        }

        .page { display: none; }
        .page.active { display: block; animation: fadeIn 0.3s ease; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .teddy { width: 58px; height: 58px; margin: 0 auto 6px; display: block; }
        .header { text-align: center; margin-bottom: 6px; }
        .title { font-size: 19px; font-weight: bold; color: #6b5b7b; letter-spacing: 0.5px; }
        .subtitle { font-size: 12px; color: #9388a0; margin-top: 4px; font-weight: 500; }
        .greeting { text-align: center; font-size: 15px; color: #7a6b8a; margin: 10px 0 4px; font-weight: 600; }

        .quote-box {
            background: rgba(255, 255, 255, 0.6);
            border-radius: 18px;
            padding: 14px 12px;
            margin: 10px 0 20px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }
        .quote-cn { font-size: 14px; color: #5a4d6b; line-height: 1.6; margin-bottom: 6px; font-weight: 500; }
        .quote-en { font-size: 11px; color: #8b7f9e; line-height: 1.5; font-style: italic; }

        .module-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 10px;
        }

        .module-card {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            border-radius: 20px;
            cursor: pointer;
            transition: transform 0.2s;
            border: 1px solid rgba(255,255,255,0.8);
            box-shadow: 0 4px 15px rgba(80, 90, 110, 0.08);
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
        }
        
        .module-card:active { transform: scale(0.97); }
        
        .module-icon { font-size: 26px; margin-right: 16px; width: 40px; text-align: center;}
        .module-info { display: flex; flex-direction: column; }
        .module-label { font-size: 16px; font-weight: bold; color: #4a3d5a; margin-bottom: 2px;}
        .module-desc { font-size: 12px; color: #9388a0; }

        .module-study { border-left: 6px solid #a3d8b7; }
        .module-video { border-left: 6px solid #a8cbe6; }
        .module-english { border-left: 6px solid #f5d5a8; }

        .dog-tip { 
            text-align: center; 
            font-size: 13px; 
            color: #8b7f9e; 
            margin-top: 24px; 
            font-weight: 600;
            background: rgba(255,255,255,0.5);
            padding: 10px;
            border-radius: 12px;
        }
        .dog-tip span { font-size: 18px; margin-right: 4px; }

        .back-btn {
            background: rgba(255,255,255,0.7);
            border: none;
            border-radius: 12px;
            padding: 8px 14px;
            font-size: 13px;
            color: #7a6b8a;
            cursor: pointer;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .page-title { font-size: 17px; font-weight: bold; color: #6b5b7b; text-align: center; margin-bottom: 6px; }

        .date-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 12px;
        }
        .date-nav-btn {
            background: rgba(255,255,255,0.8);
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 16px;
            cursor: pointer;
            color: #7a6b8a;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }
        .date-pill {
            background: #ffffffdd;
            border-radius: 20px;
            padding: 6px 16px;
            font-size: 13px;
            font-weight: 600;
            color: #6b5b7b;
            text-align: center;
            min-width: 120px;
        }
        .date-pill span { display: block; font-size: 10px; color: #9388a0; font-weight: 400; }

        .content-card {
            background: rgba(255,255,255,0.75);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            color: #5a4d6b;
            box-shadow: 0 2px 8px rgba(80,90,110,0.05);
        }
        .content-card .section-title {
            font-weight: bold;
            margin-bottom: 8px;
            color: #6b5b7b;
            font-size: 14px;
        }
        .content-card .content-text {
            font-size: 13px;
            line-height: 1.8;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- 首页 -->
        <div id="homePage" class="page active">
            <div class="header">
                <svg class="teddy" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="20" cy="22" r="14" fill="#8B5E3C"/>
                    <circle cx="20" cy="22" r="8" fill="#A0714A"/>
                    <circle cx="80" cy="22" r="14" fill="#8B5E3C"/>
                    <circle cx="80" cy="22" r="8" fill="#A0714A"/>
                    <circle cx="50" cy="52" r="34" fill="#A0714A"/>
                    <circle cx="35" cy="35" r="6" fill="#B0805A" opacity="0.5"/>
                    <circle cx="65" cy="35" r="6" fill="#B0805A" opacity="0.5"/>
                    <circle cx="30" cy="55" r="5" fill="#B0805A" opacity="0.5"/>
                    <circle cx="70" cy="55" r="5" fill="#B0805A" opacity="0.5"/>
                    <ellipse cx="50" cy="60" rx="18" ry="14" fill="#D4A574"/>
                    <circle cx="38" cy="46" r="5" fill="#3D2B1F"/>
                    <circle cx="62" cy="46" r="5" fill="#3D2B1F"/>
                    <circle cx="40" cy="44" r="1.5" fill="#FFFFFF"/>
                    <circle cx="64" cy="44" r="1.5" fill="#FFFFFF"/>
                    <ellipse cx="30" cy="58" rx="5" ry="3" fill="#F5A0B5" opacity="0.7"/>
                    <ellipse cx="70" cy="58" rx="5" ry="3" fill="#F5A0B5" opacity="0.7"/>
                    <ellipse cx="50" cy="57" rx="4" ry="3" fill="#3D2B1F"/>
                    <path d="M46 62 Q50 68 54 62" stroke="#3D2B1F" stroke-width="2" fill="none" stroke-linecap="round"/>
                </svg>
                <div class="title">Sylvia's Daily Beauty Life</div>
                <div class="subtitle" id="homeDate"></div>
            </div>
            <div class="greeting" id="greeting"></div>
            <div class="quote-box">
                <div class="quote-cn" id="quoteCn"></div>
                <div class="quote-en" id="quoteEn"></div>
            </div>
            
            <!-- 竖排列表 -->
            <div class="module-list">
                <div class="module-card module-study" onclick="openModule('study')">
                    <div class="module-icon">🌿</div>
                    <div class="module-info">
                        <div class="module-label">Study</div>
                        <div class="module-desc">政治热点 & 新闻资讯</div>
                    </div>
                </div>
                <div class="module-card module-video" onclick="openModule('video')">
                    <div class="module-icon">🎞️</div>
                    <div class="module-info">
                        <div class="module-label">Video</div>
                        <div class="module-desc">PR & 剪映 每日修炼</div>
                    </div>
                </div>
                <div class="module-card module-english" onclick="openModule('english')">
                    <div class="module-icon">🔤</div>
                    <div class="module-info">
                        <div class="module-label">English</div>
                        <div class="module-desc">单词任务 & 趣味小作文</div>
                    </div>
                </div>
            </div>
            
            <div class="dog-tip"><span>🐶</span><span id="dogQuote">小狗说：今天也要加油哦~</span></div>
        </div>

        <!-- Study 页面 -->
        <div id="studyPage" class="page">
            <button class="back-btn" onclick="backHome()">← 返回</button>
            <div class="page-title">🌿 Study</div>
            <div class="date-bar">
                <button class="date-nav-btn" onclick="changeDate('study', -1)">←</button>
                <div class="date-pill" id="studyDate">今天<span>加载中...</span></div>
                <button class="date-nav-btn" onclick="changeDate('study', 1)">→</button>
            </div>
            <div id="studyContent"></div>
        </div>

        <!-- Video 页面 -->
        <div id="videoPage" class="page">
            <button class="back-btn" onclick="backHome()">← 返回</button>
            <div class="page-title">🎞️ Video</div>
            <div class="date-bar">
                <button class="date-nav-btn" onclick="changeDate('video', -1)">←</button>
                <div class="date-pill" id="videoDate">今天<span>加载中...</span></div>
                <button class="date-nav-btn" onclick="changeDate('video', 1)">→</button>
            </div>
            <div id="videoContent"></div>
        </div>

        <!-- English 页面 -->
        <div id="englishPage" class="page">
            <button class="back-btn" onclick="backHome()">← 返回</button>
            <div class="page-title">🔤 English</div>
            <div class="date-bar">
                <button class="date-nav-btn" onclick="changeDate('english', -1)">←</button>
                <div class="date-pill" id="englishDate">今天<span>加载中...</span></div>
                <button class="date-nav-btn" onclick="changeDate('english', 1)">→</button>
            </div>
            <div id="englishContent"></div>
        </div>
    </div>

    <script>
        let historyData = {};
        let latestDateStr = '';
        let pageDates = { study: '', video: '', english: '' };

        function getTodayStr() {
            const d = new Date();
            return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
        }

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }

        function openModule(module) {
            if (!pageDates[module]) pageDates[module] = latestDateStr || getTodayStr();
            showPage(module + 'Page');
            renderModule(module);
        }

        function backHome() {
            showPage('homePage');
            const todayData = historyData[latestDateStr];
            if (todayData) {
                document.getElementById('quoteCn').textContent = todayData.quote_cn || '';
                document.getElementById('quoteEn').textContent = todayData.quote_en || '';
                if (todayData.dog_quote) {
                    document.getElementById('dogQuote').textContent = "小狗说：" + todayData.dog_quote;
                }
            }
        }

        function changeDate(module, delta) {
            const d = new Date(pageDates[module] + 'T00:00:00');
            d.setDate(d.getDate() + delta);
            pageDates[module] = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
            renderModule(module);
        }

        function renderModule(module) {
            const dateStr = pageDates[module];
            const isToday = dateStr === latestDateStr;
            const displayText = isToday ? '今天' : dateStr;
            const subText = isToday ? '最新内容' : '历史内容';

            document.getElementById(module + 'Date').innerHTML = displayText + '<span>' + subText + '</span>';

            const dayData = historyData[dateStr];
            const contentDiv = document.getElementById(module + 'Content');

            if (!dayData) {
                contentDiv.innerHTML = '<div class="content-card"><div class="content-text">这一天还没有记录哦 🐶</div></div>';
                return;
            }

            if (module === 'study') {
                contentDiv.innerHTML = dayData.study_html || '<p>暂无内容</p >';
            } else if (module === 'video') {
                contentDiv.innerHTML = dayData.video_html || '<p>暂无内容</p >';
            } else if (module === 'english') {
                contentDiv.innerHTML = dayData.english_html || '<p>暂无内容</p >';
            }
        }

        function updateDateTime() {
            const now = new Date();
            const dateStr = now.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
            document.getElementById('homeDate').textContent = dateStr;
        }

        function updateGreeting() {
            const hour = new Date().getHours();
            let msg = '';
            if (hour >= 5 && hour < 11) msg = '早上好，Sylvia 🌅';
            else if (hour >= 11 && hour < 14) msg = '中午好，Sylvia ☀️';
            else if (hour >= 14 && hour < 18) msg = '下午好，Sylvia 🌤';
            else if (hour >= 18 && hour < 23) msg = '晚上好，Sylvia 🌙';
            else msg = '夜深了，Sylvia 💤';
            document.getElementById('greeting').textContent = msg;
        }

        async function loadData() {
            try {
                const res = await fetch('data.json?t=' + Date.now());
                const data = await res.json();
                historyData = data.history || {};
                latestDateStr = data.latest || getTodayStr();

                pageDates.study = latestDateStr;
                pageDates.video = latestDateStr;
                pageDates.english = latestDateStr;

                const todayData = historyData[latestDateStr];
                if (todayData) {
                    document.getElementById('quoteCn').textContent = todayData.quote_cn || '';
                    document.getElementById('quoteEn').textContent = todayData.quote_en || '';
                    if (todayData.dog_quote) {
                        document.getElementById('dogQuote').textContent = "小狗说：" + todayData.dog_quote;
                    }
                }
            } catch (e) {
                console.error('加载 data.json 失败', e);
            }
        }

        updateDateTime();
        updateGreeting();
        loadData();
        setInterval(updateDateTime, 60000);
    </script>
</body>
</html>
